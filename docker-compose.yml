version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: euroguard_db
    restart: always
    environment:
      POSTGRES_USER: euroguard_user
      POSTGRES_PASSWORD: euroguard_password
      POSTGRES_DB: euroguard_db
    ports:
      - "5433:5432"  # Alterado a porta externa para 5433
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: